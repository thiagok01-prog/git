<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            flex-direction: center;
            flex-direction: column;
            align-items: center;
        }
        #historico{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            gap:10px
        }
    button{
        border: none;
        border-radius: 5px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover{
        background-color: brown;
    }
    button:active{
        background-color: rgb(211, 154, 137);
    }
</style>
</head>
<body>
    
    <button id="sortear" onclick="sortear()">Sortear</button>
    <div id = "historico"></div>
    <script>
        var valoresSorteados =[]
        function sortear() {
            r=Math.floor(Math.random()*100)+1;
            console.log(r)
            valoresSorteados.push(r);
            console.log(valoresSorteados);
            span=document.createElement("span");
            span.textContent=r;
            historico.appendChild(span);
        }
    </script>

</body>
</html>
