<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div{border: 1px solid black}
        .box{border: 1px solid pink;
        display: inline-block;
        width: 100px;
        height: 100px;
    }
    .container{position: relative;}
    #box1{background-color: bisque;
    position: fixed;
top: 0px;
left: 0px;}

    #box2{background-color: green;
    position: fixed;
top: 0px;
right: 0px;}

    #box3{background-color: blueviolet;
    position: fixed;
bottom: 0px;
left: 0px;}

    #box4{background-color: gray;
    position: absolute;
bottom: 0px;
right: 0px;}

    #box5{background-color: orange;
    position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);}
    </style>
</head>
<body>
    <h1>positions</h1>
    <div class="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>
        <div id="box5" class="box">box5</div>
    </div>
</body>
</html>
